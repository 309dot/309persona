services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../backend/.env.staging
    ports:
      - "8000:8080"
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    depends_on:
      - api
    ports:
      - "4173:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

